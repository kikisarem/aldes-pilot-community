{
  "rest": [
    {
      "resource": "http://127.0.0.1:8771/api/state",
      "scan_interval": 5,
      "timeout": 4,
      "sensor": [
        {
          "name": "Aldes Pilot rapport",
          "unique_id": "aldes_pilot_rest_report",
          "value_template": "{{ 'online' if value_json.available else 'offline' }}",
          "json_attributes": [
            "air",
            "ecs",
            "zones",
            "recovery",
            "busy",
            "cooldown_s"
          ]
        }
      ]
    }
  ],
  "rest_command": {
    "aldes_pilot_air": {
      "url": "http://127.0.0.1:8771/api/air",
      "method": "POST",
      "headers": {
        "x-pilot-ui": "1"
      },
      "content_type": "application/json",
      "payload": "{\"mode\": {{ mode | int }} }",
      "timeout": 100
    },
    "aldes_pilot_ecs": {
      "url": "http://127.0.0.1:8771/api/ecs",
      "method": "POST",
      "headers": {
        "x-pilot-ui": "1"
      },
      "content_type": "application/json",
      "payload": "{\"mode\": {{ mode | int }} }",
      "timeout": 100
    },
    "aldes_pilot_setpoint": {
      "url": "http://127.0.0.1:8771/api/setpoint",
      "method": "POST",
      "headers": {
        "x-pilot-ui": "1"
      },
      "content_type": "application/json",
      "payload": "{\"zone\": {{ zone | int }}, \"temperature\": {{ temperature | float }} }",
      "timeout": 100
    },
    "aldes_pilot_vacation_clear": {
      "url": "http://127.0.0.1:8771/api/vacation/clear",
      "method": "POST",
      "headers": {
        "x-pilot-ui": "1"
      },
      "content_type": "application/json",
      "payload": "{}",
      "timeout": 100
    }
  },
  "template": [
    {
      "select": [
        {
          "name": "Aldes Pilot AIR",
          "unique_id": "aldes_pilot_rest_air",
          "availability": "{{ is_state('sensor.aldes_pilot_rapport', 'online') and not state_attr('sensor.aldes_pilot_rapport', 'busy') and (state_attr('sensor.aldes_pilot_rapport', 'cooldown_s') | float(0)) <= 0 and (state_attr('sensor.aldes_pilot_rapport', 'recovery') or {}).get('status') != 'recovering' }}",
          "optimistic": false,
          "options": "{{ [\"Arrêt\", \"Chauffage Confort\", \"Chauffage Éco\", \"Chauffage Programme A\", \"Chauffage Programme B\", \"Clim Confort\", \"Clim Boost\", \"Clim Programme C\", \"Clim Programme D\"] }}",
          "state": "{% set v = (state_attr('sensor.aldes_pilot_rapport', 'air') or {}).get('actual') %}{{ [\"Arrêt\", \"Chauffage Confort\", \"Chauffage Éco\", \"Chauffage Programme A\", \"Chauffage Programme B\", \"Clim Confort\", \"Clim Boost\", \"Clim Programme C\", \"Clim Programme D\"][v] if v is integer and 0 <= v < 9 else none }}",
          "select_option": [
            {
              "condition": "template",
              "value_template": "{{ is_state('sensor.aldes_pilot_rapport', 'online') and not state_attr('sensor.aldes_pilot_rapport', 'busy') and (state_attr('sensor.aldes_pilot_rapport', 'cooldown_s') | float(0)) <= 0 and (state_attr('sensor.aldes_pilot_rapport', 'recovery') or {}).get('status') != 'recovering' }}"
            },
            {
              "action": "rest_command.aldes_pilot_air",
              "data": {
                "mode": "{{ [\"Arrêt\", \"Chauffage Confort\", \"Chauffage Éco\", \"Chauffage Programme A\", \"Chauffage Programme B\", \"Clim Confort\", \"Clim Boost\", \"Clim Programme C\", \"Clim Programme D\"].index(option) }}"
              },
              "response_variable": "reply"
            },
            {
              "if": [
                {
                  "condition": "template",
                  "value_template": "{{ reply.status != 200 or reply.content is not mapping or not reply.content.get('ok', false) }}"
                }
              ],
              "then": [
                {
                  "stop": "Commande refusée ou livraison non confirmée ; consulter Aldes Pilot.",
                  "error": true
                }
              ]
            },
            {
              "action": "homeassistant.update_entity",
              "target": {
                "entity_id": "sensor.aldes_pilot_rapport"
              }
            }
          ]
        },
        {
          "name": "Aldes Pilot ECS",
          "unique_id": "aldes_pilot_rest_ecs",
          "availability": "{{ is_state('sensor.aldes_pilot_rapport', 'online') and not state_attr('sensor.aldes_pilot_rapport', 'busy') and (state_attr('sensor.aldes_pilot_rapport', 'cooldown_s') | float(0)) <= 0 and (state_attr('sensor.aldes_pilot_rapport', 'recovery') or {}).get('status') != 'recovering' }}",
          "optimistic": false,
          "options": "{{ [\"Arrêt\", \"Marche\", \"Boost\"] }}",
          "state": "{% set v = (state_attr('sensor.aldes_pilot_rapport', 'ecs') or {}).get('actual') %}{{ [\"Arrêt\", \"Marche\", \"Boost\"][v] if v is integer and 0 <= v < 3 else none }}",
          "select_option": [
            {
              "condition": "template",
              "value_template": "{{ is_state('sensor.aldes_pilot_rapport', 'online') and not state_attr('sensor.aldes_pilot_rapport', 'busy') and (state_attr('sensor.aldes_pilot_rapport', 'cooldown_s') | float(0)) <= 0 and (state_attr('sensor.aldes_pilot_rapport', 'recovery') or {}).get('status') != 'recovering' }}"
            },
            {
              "action": "rest_command.aldes_pilot_ecs",
              "data": {
                "mode": "{{ [\"Arrêt\", \"Marche\", \"Boost\"].index(option) }}"
              },
              "response_variable": "reply"
            },
            {
              "if": [
                {
                  "condition": "template",
                  "value_template": "{{ reply.status != 200 or reply.content is not mapping or not reply.content.get('ok', false) }}"
                }
              ],
              "then": [
                {
                  "stop": "Commande refusée ou livraison non confirmée ; consulter Aldes Pilot.",
                  "error": true
                }
              ]
            },
            {
              "action": "homeassistant.update_entity",
              "target": {
                "entity_id": "sensor.aldes_pilot_rapport"
              }
            }
          ]
        }
      ],
      "number": [
        {
          "name": "Aldes Pilot Consigne K1",
          "unique_id": "aldes_pilot_rest_k1",
          "availability": "{{ is_state('sensor.aldes_pilot_rapport', 'online') and not state_attr('sensor.aldes_pilot_rapport', 'busy') and (state_attr('sensor.aldes_pilot_rapport', 'cooldown_s') | float(0)) <= 0 and (state_attr('sensor.aldes_pilot_rapport', 'recovery') or {}).get('status') != 'recovering' }}",
